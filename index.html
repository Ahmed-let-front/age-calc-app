<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="description" content="Age calculator app" />
    <link rel="icon" type="image/png" href="/age-calc-app/favicon-32x32.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Age Calculator</title>
    <script type="module" crossorigin src="/age-calc-app/assets/index-CSFY3K2-.js"></script>
    <link rel="stylesheet" crossorigin href="/age-calc-app/assets/index-wRY1_6Hw.css">
  </head>
  <body class="bg-grey-100 min-h-screen flex flex-col items-center justify-center gap-8 px-4 py-16 md:px-6">
    <h1 class="sr-only">calc app</h1>
    <main class="w-full max-w-4xl rounded-3xl rounded-br-[6rem] bg-white p-8 md:rounded-br-[12rem] md:p-16">
      <form novalidate class="relative flex flex-col md:block gap-4 md:gap-8" id="formInpClac">
        <div class="flex gap-4 md:gap-8">
          <div>
            <label class="field-label" for="day">Day</label>
            <input
              class="field-input"
              type="text"
              inputmode="numeric"
              id="day"
              name="day"
              placeholder="DD"
              maxlength="2"
              autocomplete="on"
            />
            <p class="field-error"></p>
          </div>
          <div>
            <label class="field-label" for="month">Month</label>
            <input
              class="field-input"
              type="text"
              inputmode="numeric"
              id="month"
              name="month"
              placeholder="MM"
              maxlength="2"
              autocomplete="on"
            />
            <p class="field-error"></p>
          </div>
          <div>
            <label class="field-label" for="year">Year</label>
            <input
              class="field-input"
              type="text"
              inputmode="numeric"
              id="year"
              name="year"
              placeholder="YYYY"
              maxlength="4"
              autocomplete="on"
            />
            <p class="field-error"></p>
          </div>
        </div>

        <div class="relative my-8 md:my-20">
          <div class="h-px w-full bg-grey-200"></div>
          <button
            type="submit"
            aria-label="Calculate age"
            class="btn-submit absolute left-1/2 top-1/2 -translate-1/2 -bottom-16 md:-bottom-14 cursor-pointer"
          >
            <svg class="icon-arrow" aria-hidden="true">
              <use href="icons.svg#icon-arrow-right"></use>
            </svg>
          </button>
        </div>
      </form>

      <div class="mt-8 md:mt-4 leading-none pt-8">
        <p class="result-line"><output class="result-number" id="res-years">--</output> years</p>
        <p class="result-line"><output class="result-number" id="res-months">--</output> months</p>
        <p class="result-line"><output class="result-number" id="res-days">--</output> days</p>
      </div>
    </main>
    <footer class="text-center text-sm md:text-xl text-grey-600 attribution">
      Challenge by
      <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>. Coded by
      <a href="https://github.com/Ahmed-let-front">Ahmed Yasser</a>.
    </footer>
  </body>
</html>
